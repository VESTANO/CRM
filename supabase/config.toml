[auth]
site_url = "https://vestano.github.io/CRM/"
additional_redirect_urls = ["https://vestano.github.io/CRM/", "http://127.0.0.1:5173/", "http://localhost:5173/"]

[functions.crm-api]
verify_jwt = true

[functions.reminder-dispatch]
verify_jwt = true

# Receipt tokens authorize a single acknowledgement, not an account session.
[functions.reminder-receipt]
verify_jwt = false

[functions.admin-users]
verify_jwt = true

# Biometric devices use the iClock protocol rather than browser JWT sessions.
[functions.iclock]
verify_jwt = false

name: Deploy CRM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build CRM for GitHub Pages
        working-directory: frontend
        run: |
          npm run build -- --mode pages
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Verify live attendance behavior
        working-directory: frontend
        run: node --test src/services/attendanceFeed.test.mjs src/services/profileReadCache.test.mjs src/utils/attendance.test.mjs
      - name: Verify reminder delivery assets and tests
        working-directory: frontend
        run: |
          test -s dist/service-worker.js
          test -s dist/reminder-worker-core.js
          test -s dist/notification-icon.svg
          node --test src/services/reminderPush.test.mjs src/services/reminderWorker.test.mjs ../supabase/functions/_shared/reminder-delivery.test.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
